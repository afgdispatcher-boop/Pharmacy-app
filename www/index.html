<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>Pharmacy</title>
<style>
:root{--bg:#f3f6f5;--c:#fff;--ink:#0f2420;--mut:#62736f;--ac:#0b7a6f;--ac2:#08574f;--red:#c0392b;--amb:#b45309;--ln:#e2eae8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
header{background:var(--ac);color:#fff;padding:14px 18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;font-weight:700}header small{display:block;opacity:.8;font-size:12.5px;margin-top:2px}
main{padding:14px 14px 96px;max-width:640px;margin:auto}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5;box-shadow:0 -2px 12px #0b2a2612}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
nav .on{color:var(--ac);font-weight:700}
.card{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.card.p{padding:14px}
.hero{background:var(--ac2);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.hero>span{font-size:13px;opacity:.8}.hero>b{display:block;font-size:34px;margin:2px 0 14px;font-weight:700}
.hero div{display:flex;gap:10px;border-top:1px solid #ffffff2e;padding-top:12px}.hero div p{flex:1;margin:0;font-size:12px;opacity:.85}.hero div p b{display:block;font-size:16px;opacity:1;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;height:100%}.st span{font-size:12.5px;color:var(--mut)}.st b{display:block;font-size:22px;margin-top:2px}
input,select{width:100%;height:48px;padding:0 13px;border:1.5px solid #cfdad7;border-radius:12px;font-size:16px;margin:4px 0 10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #0b7a6f26}
label{font-size:13px;color:var(--mut);font-weight:500}
.b{border:0;border-radius:12px;height:48px;padding:0 18px;background:var(--ac);color:#fff;font-size:15px;font-weight:600;width:100%;margin:4px 0}
.b:active{background:var(--ac2)}.b.r{background:#fff;color:var(--red);border:1.5px solid var(--red)}.b.g{background:#e8eeed;color:var(--ink)}.b.o{background:#fff;color:var(--ac);border:1.5px solid var(--ac)}
.b.s{width:42px;height:42px;padding:0;border-radius:50%;font-size:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row>div:first-child{font-weight:600;min-width:0}.row small{color:var(--mut);display:block;font-weight:400;font-size:13px;margin-top:1px}
.row .ic{display:flex;align-items:center;gap:14px;font-weight:600}.row .ic svg{color:var(--ac)}
.low{color:var(--red);font-weight:700}
.pill{display:inline-block;min-width:34px;text-align:center;padding:4px 10px;border-radius:99px;background:#e3f2ef;color:var(--ac2);font-weight:700;font-size:14px}.pill.bad{background:#fbe4e1;color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-bottom:4px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.bars i{display:block;background:var(--ac);border-radius:5px 5px 0 0;min-height:3px;margin:3px 0}
h3{margin:18px 2px 8px;font-size:14px;color:var(--mut);font-weight:600}.empty{color:var(--mut);text-align:center;padding:22px 0}
#m{position:fixed;inset:0;background:#0a1f1c88;display:none;align-items:flex-end;z-index:9}
#m>div{background:#fff;width:100%;max-height:90vh;overflow:auto;padding:12px 18px calc(18px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;max-width:640px;margin:auto}
#m>div:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#cfdad7;margin:0 auto 6px}
#mb h3{margin:8px 0 10px;font-size:18px;color:var(--ink)}
img{display:block}.ta{width:100%;height:120px;border:1.5px solid #cfdad7;border-radius:12px;padding:10px;font:12px monospace;margin:4px 0 8px}.ab{text-align:center;padding:26px 14px}.ab img{width:132px;height:132px;border-radius:50%;margin:0 auto 14px;border:3px solid var(--ln);object-fit:cover}.ab h2{margin:0;font-size:22px}.ab p{margin:4px 0 0;color:var(--mut)}
pre.rc{background:#f3f6f5;border-radius:12px;padding:14px;font:14px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:0 0 10px}
#lg{position:fixed;inset:0;background:var(--ac2);z-index:20;display:flex;flex-direction:column;justify-content:center;padding:30px;color:#fff;text-align:center;max-width:none}
#lg>*{max-width:360px;width:100%;margin-left:auto;margin-right:auto}
#lg .logo{width:76px;height:76px;border-radius:22px;background:#ffffff1f;display:flex;align-items:center;justify-content:center}#lg .logo svg{width:40px;height:40px}
#lg h1{margin:14px auto 4px;font-size:26px}#lg p{margin:0 auto 26px;opacity:.75;font-size:14px}#lg small{opacity:.7;margin-top:10px}
#lg input{border:0;text-align:left}#lg .b{background:#fff;color:var(--ac2)}
</style></head><body>
<div id="lg"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M10.5 20.5a5 5 0 0 1-7-7l9-9a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/></svg></div><h1 id="ln">Pharmacy</h1><p>Sign in to manage your pharmacy</p>
<input id="u" value="admin" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
<button class="b" onclick="login()">Sign in</button><small>Default: admin / admin123</small></div>

let cur='home',cart=[],q='';
function login(){if($('u').value.trim()==db.user&&hp($('p').value)==db.pass){$('lg').style.display='none';go('home');const n=low().length;if(n)alert(n+' medicine(s) are low on stock!')}else alert('Wrong username or password')}
function go(v){cur=v;q='';$('ti').textContent=NAMES[v];$('dt').textContent=db.shop+' · '+new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'});$('ln').textContent=db.shop;
$('nv').innerHTML=MAIN.map(m=>`<button class="${m[0]==v||(m[0]=='more'&&MORE.some(x=>x[0]==v))?'on':''}" onclick="go('${m[0]}')">${ico(m[0])}${m[2]}</button>`).join('');
$('v').innerHTML=V[v]();scrollTo(0,0)}
const low=()=>db.meds.filter(m=>m.qty<=m.min).sort((a,b)=>a.qty-b.qty);
const exp=()=>db.meds.filter(m=>m.expiry&&m.expiry<=td(60)).sort((a,b)=>a.expiry>b.expiry?1:-1);
const prof=s=>{const S=db.sales.filter(x=>x.day>=s);return{g:S.reduce((a,x)=>a+x.profit,0),s:S.reduce((a,x)=>a+x.total,0),e:db.exps.filter(x=>x.day>=s).reduce((a,x)=>a+x.amount,0)}};
const per=()=>{const t=td();return[['Daily',t],['Weekly',td(-6)],['Monthly',t.slice(0,8)+'01'],['Yearly',t.slice(0,5)+'01-01']]};
const tile=(l,v,c)=>`<div class="st"><span>${l}</span><b style="color:${c}">${v}</b></div>`;
const rows=a=>a.length?a.join(''):'<div class="empty">Nothing here yet.</div>';
function modal(h){$('mb').innerHTML=h;$('m').style.display='flex'}
const closeM=()=>$('m').style.display='none';
$('m').onclick=e=>{if(e.target.id=='m')closeM()};
// generic CRUD
const F={
meds:{k:'meds',f:[['name','Name','text'],['category','Category','text'],['qty','Qty','number','0'],['buy','Buy price','number'],['sell','Sell price','number'],['min','Min qty (low-stock alert)','number','10'],['expiry','Expiry date','date']],t:m=>E(m.name),s:m=>`${E(m.category)} · buy ${M(m.buy)} · sell ${M(m.sell)}${m.expiry?' · <span class="'+(m.expiry<=td()?'low':'')+'">exp '+m.expiry+'</span>':''}`,r:m=>`<span class="pill ${m.qty<=m.min?'bad':''}">${m.qty}</span>`},
sups:{k:'sups',f:[['name','Name','text'],['phone','Phone','tel'],['address','Address','text']],t:m=>E(m.name),s:m=>E(m.phone)+' '+E(m.address),r:()=>''},
custs:{k:'custs',f:[['name','Name','text'],['phone','Phone','tel'],['address','Address','text']],t:m=>E(m.name),s:m=>E(m.phone)+' '+E(m.address),r:()=>''},
exps:{k:'exps',f:[['title','Title (rent, salary…)','text'],['amount','Amount','number'],['day','Date','date',td]],t:m=>E(m.title),s:m=>m.day,r:m=>M(m.amount)}};
function crud(n){const c=F[n],L=db[c.k].filter(m=>JSON.stringify(m).toLowerCase().includes(q.toLowerCase())).reverse();
return `<input placeholder="Search" value="${E(q)}" oninput="q=this.value;go2('${n}')" id="sq"><button class="b" onclick="edit('${n}')">Add</button><div class="card">${rows(L.map(m=>`<div class="row" onclick="edit('${n}',${m.id})"><div>${c.t(m)}<small>${c.s(m)}</small></div><b>${c.r(m)}</b></div>`))}</div>`}
function go2(n){const f=document.activeElement.selectionStart;$('v').innerHTML=V[n]();const s=$('sq');if(s){s.focus();s.setSelectionRange(f,f)}}
function edit(n,i){const c=F[n],o=i?db[c.k].find(x=>x.id==i):{};
modal(`<h3>${i?'Edit':'Add'}</h3>`+c.f.map(f=>`<label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]}" step="any" value="${E(o[f[0]]??(typeof f[3]=='function'?f[3]():f[3]??''))}">`).join('')+`<button class="b" onclick="sv('${n}',${i||0})">Save</button>${i?`<button class="b r" onclick="del('${n}',${i})">Delete</button>`:''}<button class="b g" onclick="closeM()">Cancel</button>`)}
function sv(n,i){const c=F[n],o={};for(const f of c.f){let v=$('f_'+f[0]).value.trim();if(f[2]=='number'){v=parseFloat(v);if(isNaN(v))return alert('Enter a valid '+f[1])}o[f[0]]=v}
if(!String(o[c.f[0][0]]).trim())return alert('Please enter '+c.f[0][1]);
if(i)Object.assign(db[c.k].find(x=>x.id==i),o);else db[c.k].push({id:id(),...o});save();closeM();go(cur)}
function del(n,i){if(confirm('Delete this record?')){db[F[n].k]=db[F[n].k].filter(x=>x.id!=i);save();closeM();go(cur)}}
const V={
home(){const P={};per().forEach(([n,s])=>P[n]=prof(s));const sv=db.meds.reduce((a,m)=>a+m.qty*m.buy,0);
const d=[...Array(7)].map((_,i)=>td(i-6)),vs=d.map(x=>db.sales.filter(s=>s.day==x).reduce((a,s)=>a+s.profit,0)),mx=Math.max(1,...vs);
return `<div class="hero"><span>Today's profit</span><b>${M(P.Daily.g)}</b><div><p>Sales today<b>${M(P.Daily.s)}</b></p><p>Week profit<b>${M(P.Weekly.g)}</b></p><p>Month profit<b>${M(P.Monthly.g)}</b></p></div></div>
<div class="two"><button class="b" onclick="go('sales')">New sale</button><button class="b o" onclick="go('purch')">Add stock</button></div>
<h3>Overview</h3><div class="grid">
${tile('Net month (after expenses)',M(P.Monthly.g-P.Monthly.e),'#0f2420')}${tile('Stock value',M(sv),'#0f2420')}
<div onclick="go('alerts')">${tile('Low stock',low().length,low().length?'#c0392b':'#0f2420')}</div><div onclick="go('alerts')">${tile('Expiring in 60 days',exp().length,exp().length?'#b45309':'#0f2420')}</div>
${tile('Medicines',db.meds.length,'#0f2420')}${tile('Customers',db.custs.length,'#0f2420')}</div>
<div class="card p"><b>Profit, last 7 days</b><div class="bars" style="margin-top:10px">${vs.map((v,i)=>`<div>${M(v)}<i style="height:${Math.max(0,v)/mx*80}px"></i>${new Date(d[i]+'T00:00').toLocaleDateString('en',{weekday:'short'})}</div>`).join('')}</div></div>`},
meds:()=>crud('meds'),sups:()=>crud('sups'),custs:()=>crud('custs'),exps:()=>crud('exps'),
more:()=>`<div class="card">${MORE.map(m=>`<div class="row" onclick="go('${m[0]}')"><span class="ic">${ico(m[0])}${m[2]}</span><span style="color:var(--mut)">›</span></div>`).join('')}</div><button class="b r" onclick="location.reload()">Log out</button>`,
sales(){const r=q?db.meds.filter(m=>m.qty>0&&m.name.toLowerCase().includes(q.toLowerCase())).slice(0,6):[];const tot=cart.reduce((a,c)=>a+c.n*c.m.sell,0);
return `<input id="sq" placeholder="Type medicine name to sell" value="${E(q)}" oninput="q=this.value;go2('sales')">
${r.length?`<div class="card">${r.map(m=>`<div class="row" onclick="addc(${m.id})"><div>${E(m.name)}<small>stock ${m.qty}</small></div><b>${M(m.sell)}</b></div>`).join('')}</div>`:''}
<div class="card p"><b>Cart</b>${rows(cart.map((c,i)=>`<div class="row"><div>${E(c.m.name)}<small>${M(c.m.sell)} × ${c.n} = ${M(c.m.sell*c.n)}</small></div><div><div style="display:flex;gap:8px"><button class="b s g" onclick="qty(${i},-1)">−</button><button class="b s" onclick="qty(${i},1)">+</button></div></div></div>`))}
<h3 style="text-align:right;font-size:20px;color:var(--ink)">Total: ${M(tot)}</h3></div>
<label>Customer</label><select id="cu"><option>Walk-in</option>${db.custs.map(c=>`<option>${E(c.name)}</option>`).join('')}</select>
<button class="b" onclick="done()">Complete sale</button>
<h3>Today's sales (tap to cancel)</h3><div class="card">${rows(db.sales.filter(s=>s.day==td()).reverse().map(s=>`<div class="row" onclick="undo(${s.id})"><div>${E(s.name)} ×${s.qty}<small>${s.invoice} · ${E(s.customer)}</small></div><b>${M(s.total)}</b></div>`))}</div>`},
purch(){return `<div class="card p"><label>Medicine</label><select id="pm">${db.meds.map(m=>`<option value="${m.id}">${E(m.name)} (stock ${m.qty})</option>`).join('')}</select>
<label>Supplier</label><input id="ps" list="sl" placeholder="Supplier"><datalist id="sl">${db.sups.map(s=>`<option>${E(s.name)}`).join('')}</datalist>
<label>Quantity</label><input id="pq" type="number"><label>Unit cost</label><input id="pc" type="number" step="any"><button class="b" onclick="buy()">Add stock</button></div>
<div class="card">${rows(db.purch.slice().reverse().map(x=>`<div class="row"><div>${E(x.name)}<small>${E(x.supplier)} · ${x.day}</small></div><b>+${x.qty} @ ${M(x.cost)}</b></div>`))}</div>`},
alerts(){return `<h3>Low stock</h3><div class="card">${rows(low().map(m=>`<div class="row"><div>${E(m.name)}<small>min ${m.min}</small></div><b class="low">${m.qty}</b></div>`))}</div>
<h3>Expired or expiring within 60 days</h3><div class="card">${rows(exp().map(m=>`<div class="row"><div>${E(m.name)}<small>qty ${m.qty}</small></div><b>${m.expiry}</b></div>`))}</div>`},
reports(){const top={};db.sales.forEach(s=>{(top[s.name]=top[s.name]||{n:0,g:0}).n+=s.qty;top[s.name].g+=s.profit});
const days={};db.sales.filter(s=>s.day>=td(-29)).forEach(s=>{(days[s.day]=days[s.day]||{n:0,t:0,g:0});days[s.day].n+=s.qty;days[s.day].t+=s.total;days[s.day].g+=s.profit});
return `<div class="grid">${per().map(([n,s])=>{const x=prof(s);return tile(`${n} · sales ${M(x.s)} · exp ${M(x.e)}`,'Net '+M(x.g-x.e),'#0f766e')}).join('')}</div>
<h3>Last 30 days</h3><div class="card">${rows(Object.keys(days).sort().reverse().map(d=>`<div class="row"><div>${d}<small>${days[d].n} items · sales ${M(days[d].t)}</small></div><b>${M(days[d].g)}</b></div>`))}</div>
<h3>Top selling</h3><div class="card">${rows(Object.entries(top).sort((a,b)=>b[1].n-a[1].n).slice(0,10).map(([k,v])=>`<div class="row"><div>${E(k)}<small>sold ${v.n}</small></div><b>${M(v.g)}</b></div>`))}</div>
<button class="b" onclick="csv()">Export sales (CSV)</button>`},
about(){return `<div class="card p ab"><img src="${PHOTO}" alt="Hakim Noor"><h2>Hakim Noor</h2><p>Computer Programmer</p></div>
<div class="card"><div class="row"><div>App<small>${E(db.shop)} – Pharmacy Management System</small></div></div><div class="row"><div>Version<small>1.0 · works offline, data stays on this phone</small></div></div></div>`},
settings(){return `<div class="card p"><label>Shop name</label><input id="sn" value="${E(db.shop)}"><button class="b" onclick="db.shop=$('sn').value.trim()||'Pharmacy';save();go('settings')">Save shop name</button>
<label>New password</label><input id="np" type="password"><button class="b" onclick="chg()">Change password</button></div>
<div class="card p"><button class="b" onclick="bk()">Backup data</button><label>Restore backup file</label><input type="file" accept=".json" onchange="rs(this)"><label>Or paste backup text</label><textarea id="rt" class="ta"></textarea><button class="b o" onclick="confirm('Replace current data?')&&ld($('rt').value)">Restore from text</button></div>`}};
function addc(i){const m=db.meds.find(x=>x.id==i),c=cart.find(x=>x.m.id==i);if(c){if(c.n>=m.qty)return alert('Only '+m.qty+' in stock');c.n++}else cart.push({m,n:1});q='';go('sales')}
function qty(i,d){const c=cart[i];c.n+=d;if(c.n>c.m.qty){c.n=c.m.qty;alert('Only '+c.m.qty+' in stock')}if(c.n<1)cart.splice(i,1);go('sales')}
function done(){cart=cart.filter(c=>db.meds.some(x=>x.id==c.m.id));if(!cart.length)return;const inv='INV'+Date.now().toString().slice(-9),cu=$('cu').value;let t=0,rec='';
cart.forEach(c=>{const m=db.meds.find(x=>x.id==c.m.id);if(!m)return;m.qty-=c.n;const tt=c.n*m.sell;t+=tt;rec+=`${m.name} x${c.n} = ${M(tt)}\n`;db.sales.push({id:id(),invoice:inv,med_id:m.id,name:m.name,qty:c.n,total:tt,profit:(m.sell-m.buy)*c.n,customer:cu,day:td()})});
save();cart=[];go('sales');modal('<h3>Sale complete</h3><pre class="rc">'+E(db.shop+'\n'+inv+' · '+td()+'\n\n'+rec+'\nTotal: '+M(t)+'\nCustomer: '+cu)+'</pre><button class="b" onclick="closeM()">Done</button>')}
function undo(i){const s=db.sales.find(x=>x.id==i);if(!s||!confirm('Cancel this sale and return '+s.qty+' x '+s.name+' to stock?'))return;const m=db.meds.find(x=>x.id==s.med_id);if(m)m.qty+=s.qty;db.sales=db.sales.filter(x=>x.id!=i);save();go('sales')}
function buy(){const m=db.meds.find(x=>x.id==$('pm').value),n=parseInt($('pq').value),c=parseFloat($('pc').value);if(!m||!(n>0)||isNaN(c))return alert('Select medicine and enter valid qty/cost');
m.qty+=n;m.buy=c;db.purch.push({id:id(),med_id:m.id,name:m.name,supplier:$('ps').value,qty:n,cost:c,day:td()});save();go('purch')}
function chg(){const v=$('np').value;if(v.length<4)return alert('Password too short');db.pass=hp(v);save();alert('Password changed')}
async function dl(name,text,type){const C=window.Capacitor,P=C&&C.Plugins;if(P&&P.Filesystem&&P.Share){try{const r=await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:name,url:r.uri});}catch(e){manual(name,text)}return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function manual(n,t){modal('<h3>'+E(n)+'</h3><p style="color:var(--mut)">Copy this text and keep it safe.</p><textarea id="mt" class="ta" readonly>'+E(t)+'</textarea><button class="b" onclick="$(\'mt\').select();document.execCommand(\'copy\')">Copy</button><button class="b g" onclick="closeM()">Close</button>')}
function ld(t){try{const d=JSON.parse(t);if(!d.meds)throw 0;db=d;cart=[];save();alert('Restored');go('settings')}catch(e){alert('Invalid backup')}}
function bk(){dl('pharmacy_backup_'+td()+'.json',JSON.stringify(db),'application/json')}
function rs(el){const f=el.files[0];if(!f||!confirm('Replace current data with this backup?'))return;const r=new FileReader();r.onload=()=>ld(r.result);r.readAsText(f)}
function csv(){const c=s=>'"'+String(s).replace(/"/g,'""')+'"';dl('sales_report.csv','\ufeffinvoice,medicine,qty,total,profit,customer,date\n'+db.sales.map(s=>[s.invoice,s.name,s.qty,s.total,s.profit,s.customer,s.day].map(c).join(',')).join('\n'),'text/csv')}
const AP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
if(AP)AP.addListener('backButton',()=>{if($('m').style.display=='flex')closeM();else if($('lg').style.display!='none')AP.exitApp();else if(cur!='home')go(MORE.some(x=>x[0]==cur)?'more':'home');else AP.exitApp()});
$('ln').textContent=db.shop;$('p').addEventListener('keydown',e=>{if(e.key=='Enter')login()});
</script></body></html>
